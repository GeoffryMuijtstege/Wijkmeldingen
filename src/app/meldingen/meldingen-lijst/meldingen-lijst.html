<main class="container my-4">
  <h1>Meldingen</h1>

  @if(fout()){
  <div class="alert alert-danger" role="alert">{{ fout() }}</div>
  }

  <div class="reponsive-table">
    <table class="table table-striped table-hover allign-middle">
      <caption>
        Een overzicht van alle meldingen
      </caption>
      <thead>
        <tr>
          <th scope="col">Datum</th>
          <th scope="col">Titel</th>
          <th scope="col">Categorie</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        @for(m of meldingen(); track m.id){
        <tr>
          <td>{{ m.datum | date: 'dd-MM-yyyy HH:mm' }}</td>
          <th scope="row">{{m.titel}}</th>
          <td>{{m.categorie}}</td>
          <td>{{m.status}}</td>
        </tr>
        } @empty{
        <tr>
          <td colspan="4">Geen meldingen gevonden</td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</main>
