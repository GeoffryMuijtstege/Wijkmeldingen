<div>
  <h2>Filteren</h2>
  <form class="d-flex flex-column gap-3" aria-label="Filter">
    <!--TODO: Filters die geselecteerd zijn altijd laten weergeven als de overlay opnieuw geopend wordt -->
    <div class="form-group">
      <label for="status">Status:</label>
      <select class="form-control" id="status" [(ngModel)]="selectedStatus" name="status">
        @for (s of statusOpties(); track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>
    <div class="form-group">
      <label for="categorie">Categorie:</label>
      <select class="form-control" id="categorie" [(ngModel)]="selectedCategorie" name="categorie">
        @for (c of categorieOpties(); track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>
    <div class="d-flex gap-2">
      <button
        type="button"
        class="btn btn-primary"
        (click)="onApply()"
        aria-label="Filter toepassen"
      >
        Filter toepassen
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onClose()"
        aria-label="Filter sluiten"
      >
        Filter sluiten
      </button>
    </div>
  </form>
</div>
