apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-server
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      volumes:
        - name: config
          configMap:
            name: json-server-data
        - name: data
          persistentVolumeClaim:
            claimName: json-server-data
      initContainers:
        - name: copy-db
          image: node:24-alpine
          command: ['sh', '-c', '[ -f /data/db.json ] || cp /config/db.json /data/db.json']
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      containers:
        - name: json-server
          image: node:24-alpine
          command:
            [
              'npx',
              'json-server@1.0.0-beta.15',
              '--host',
              '0.0.0.0',
              '--port',
              '3000',
              '/data/db.json',
            ]
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
